<svg xmlns="http://www.w3.org/2000/svg" width="400" height="700" viewBox="0 0 320 560" role="img" aria-labelledby="t d" lang="en">
  <title id="t">Programming Languages – Distribution of the analyzed code</title>
  <desc id="d">Python 65.3%; TypeScript 16.8%; Swift 7.2%; JavaScript 4.1%; Shell 3.5%; CSS 2.0%; HTML 0.7%; Astro 0.4%; PowerShell and PHP combined below 0.1%. Reported basis: 141,648 lines of code excluding blank lines and comments, from selected local commit snapshots (HEAD). Dependencies, build artifacts and detected generated code were excluded using documented filters. Different versions of the same tools may be counted more than once. This is not a complete GitHub activity or code authorship statistic; fork status has not been fully verified for all analyzed repositories. As of 18 Oct 2026.</desc>
  <style>
    .card { fill: #fcfcfb; stroke: #e4e3df; }
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .h { fill: #0b0b0b; font-size: 22px; font-weight: 600; }
    .sub, .foot { fill: #52514e; font-size: 14px; }
    .foot { fill: #6d6c68; }
    .lbl { fill: #0b0b0b; font-size: 18px; font-weight: 500; }
    .val { fill: #52514e; font-size: 18px; font-weight: 500; font-variant-numeric: tabular-nums; }
    .track { fill: #eeede9; }
    .bar { fill: #2a78d6; }
    .rule { stroke: #e4e3df; }
    @media (prefers-color-scheme: dark) {
      .card { fill: #1a1a19; stroke: #2e2e2c; }
      .h, .lbl { fill: #f0efec; }
      .sub, .val { fill: #c3c2b7; }
      .foot { fill: #9a998f; }
      .track { fill: #262624; }
      .bar { fill: #3987e5; }
      .rule { stroke: #2e2e2c; }
    }
  </style>
